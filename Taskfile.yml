version: "3"

vars:
  BIN_DIR: build
  BINARY: musiclib
  DB: musiclib.db

tasks:
  build:
    desc: Build the production binary (frontend + backend)
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cd web && bun run build
      - go build -ldflags="-s -w" -trimpath -o {{.BIN_DIR}}/{{.BINARY}} ./cmd/musiclib

  build:frontend:
    desc: Build frontend assets only
    cmds:
      - cd web && bun run build

  build:backend:
    desc: Build backend binary only
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags="-s -w" -trimpath -o {{.BIN_DIR}}/{{.BINARY}} ./cmd/musiclib

  build:android:
    desc: Build for Android ARM64
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cd web && bun run build
      - GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -trimpath -o {{.BIN_DIR}}/{{.BINARY}}-android-arm64 ./cmd/musiclib

  dev:
    desc: Start the server (rebuild before)
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} serve

  serve:
    desc: Run the server without rebuilding
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} serve

  import:
    desc: Import scrobbles from a source SQLite database
    usage: task import -- db.db
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} import {{.CLI_ARGS}}

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run Go tests with verbose output
    cmds:
      - go test -v ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  stats:
    desc: Show library statistics
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} stats

  fts:
    desc: Rebuild full-text search indexes
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} fts

  migrate:
    desc: Run database migrations
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} migrate

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf web/dist

  build:turso:
    desc: Build with Turso/libsql support
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cd web && bun run build
      - go build -tags turso -ldflags="-s -w" -trimpath -o {{.BIN_DIR}}/{{.BINARY}}-turso ./cmd/musiclib

  frontend:dev:
    desc: Start frontend dev server with hot reload
    cmds:
      - cd web && bun run dev

  setup:
    desc: Install all dependencies
    cmds:
      - go mod download
      - cd web && bun install
